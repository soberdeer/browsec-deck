name: Release installer

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build and verify
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Check out the tagged source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          lfs: true
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Validate the release version
        shell: bash
        run: |
          set -Eeuo pipefail

          project_version="$(
            sed -n 's/^readonly APP_VERSION="\([^"]*\)"$/\1/p' build.sh
          )"
          tag_version="${GITHUB_REF_NAME#v}"

          [[ "$project_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          if [[ "$tag_version" != "$project_version" ]]; then
            printf 'Tag version %s does not match project version %s.\n' \
              "$tag_version" "$project_version" >&2
            exit 1
          fi

          printf 'PROJECT_VERSION=%s\n' "$project_version" >>"$GITHUB_ENV"

      - name: Build and test the installer
        shell: bash
        run: ./build.sh

      - name: Scan the Go source and installer
        shell: bash
        run: |
          set -Eeuo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.6.0
          govulncheck ./...
          govulncheck -mode=binary "dist/Browsec Deck Installer"

      - name: Prepare and verify release files
        shell: bash
        run: |
          set -Eeuo pipefail

          installer="Browsec-Deck-Installer-${PROJECT_VERSION}.tar.gz"
          checksum="Browsec-Deck-Installer-${PROJECT_VERSION}.sha256"

          cd dist
          sha256sum "$installer" >"$checksum"
          sha256sum --check "$checksum"

      - name: Store verified release files
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: browsec-deck-release
          path: |
            dist/Browsec-Deck-Installer-*.tar.gz
            dist/Browsec-Deck-Installer-*.sha256
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download verified release files
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          name: browsec-deck-release
          path: dist

      - name: Verify and create the GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -Eeuo pipefail

          project_version="${GITHUB_REF_NAME#v}"
          installer="Browsec-Deck-Installer-${project_version}.tar.gz"
          checksum="Browsec-Deck-Installer-${project_version}.sha256"

          cd dist
          sha256sum --check "$checksum"
          gh release create "$GITHUB_REF_NAME" \
            "$installer" \
            "$checksum" \
            --verify-tag \
            --title "Browsec Deck ${project_version}" \
            --generate-notes
